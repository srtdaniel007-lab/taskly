<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trackly | Operational Task & Delegation Hub</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#f0f9ff',
              100: '#e0f2fe',
              500: '#0ea5e9',
              600: '#0284c7',
              700: '#0369a1',
            },
            dark: {
              800: '#131b2e',
              850: '#0f172a',
              900: '#0b1120',
              950: '#070a13'
            }
          }
        }
      }
    }
  </script>
  <!-- Alpine.js -->
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.13.5/dist/cdn.min.js"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    [x-cloak] { display: none !important; }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #0b1120; }
    ::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: #334155; }
  </style>
</head>
<body class="bg-dark-950 text-slate-100 min-h-screen antialiased flex flex-col font-sans selection:bg-sky-500/30 selection:text-sky-200" x-data="taskPulseApp()" x-init="initApp()" x-cloak>

  <!-- Top Navigation Bar -->
  <header class="sticky top-0 z-40 bg-dark-900/90 backdrop-blur-md border-b border-slate-800/80">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
      
      <!-- Logo -->
      <div class="flex items-center space-x-3 cursor-pointer" @click="filterStatus = ''; fetchTasks()">
        <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-sky-500 to-indigo-600 flex items-center justify-center shadow-lg shadow-sky-500/25">
          <i data-lucide="layers" class="w-5 h-5 text-white"></i>
        </div>
        <div>
          <span class="text-xl font-bold tracking-tight bg-gradient-to-r from-sky-400 via-indigo-200 to-white bg-clip-text text-transparent">Trackly</span>
          <span class="hidden sm:inline-block ml-1.5 px-2 py-0.5 text-[10px] font-semibold tracking-wide uppercase bg-sky-500/10 text-sky-400 border border-sky-500/20 rounded-md">Workspace</span>
        </div>
      </div>

      <!-- Actions Area -->
      <div class="flex items-center space-x-2 sm:space-x-3">
        
        <!-- Discreet Settings Icon (Configure API / DB URL) -->
        <button @click="openApiSettings()" title="Database & Server Settings" class="p-2 text-slate-400 hover:text-slate-100 hover:bg-slate-800/60 rounded-lg transition-colors">
          <i data-lucide="settings-2" class="w-4 h-4"></i>
        </button>

        <!-- Notification Bell Dropdown -->
        <template x-if="currentUser">
          <div class="relative" x-data="{ open: false }">
            <button @click="open = !open" class="relative p-2 text-slate-400 hover:text-slate-100 hover:bg-slate-800/60 rounded-lg transition-colors">
              <i data-lucide="bell" class="w-4 h-4"></i>
              <span x-show="unreadCount > 0" x-text="unreadCount" class="absolute top-1 right-1 px-1.5 py-0.2 text-[9px] font-bold bg-rose-500 text-white rounded-full min-w-[16px] text-center shadow-md"></span>
            </button>

            <!-- Notifications Flyout -->
            <div x-show="open" @click.away="open = false" class="absolute right-0 mt-2 w-80 sm:w-96 bg-dark-900 border border-slate-800 rounded-2xl shadow-2xl p-4 z-50">
              <div class="flex items-center justify-between border-b border-slate-800 pb-3 mb-3">
                <div class="flex items-center space-x-2">
                  <span class="font-semibold text-xs text-white">Notifications</span>
                  <span class="px-2 py-0.5 text-[10px] bg-slate-800 text-slate-300 rounded-full" x-text="unreadCount + ' unread'"></span>
                </div>
                <button @click="markAllNotificationsRead()" class="text-[11px] text-sky-400 hover:underline">Mark all read</button>
              </div>

              <div class="space-y-2 max-h-72 overflow-y-auto pr-1">
                <template x-if="notifications.length === 0">
                  <p class="text-xs text-slate-500 text-center py-6">No notifications yet</p>
                </template>
                <template x-for="notif in notifications" :key="notif.id">
                  <div :class="notif.is_read ? 'opacity-60 bg-dark-950' : 'bg-slate-800/60 border-l-2 border-sky-400'" class="p-2.5 rounded-lg text-xs transition flex flex-col space-y-1">
                    <p class="text-slate-200" x-text="notif.message"></p>
                    <div class="flex items-center justify-between text-[10px] text-slate-500">
                      <span x-text="formatDate(notif.created_at)"></span>
                      <button x-show="!notif.is_read" @click="markNotificationRead(notif.id)" class="text-sky-400 hover:underline">Mark read</button>
                    </div>
                  </div>
                </template>
              </div>
            </div>
          </div>
        </template>

        <!-- Authenticated Profile / Sign Out -->
        <template x-if="currentUser">
          <div class="flex items-center space-x-2.5 pl-1 sm:pl-2 border-l border-slate-800">
            <div class="text-right hidden sm:block">
              <div class="text-xs font-semibold text-slate-200 truncate max-w-[140px]" x-text="currentUser.full_name"></div>
              <div class="text-[10px] font-medium tracking-wide uppercase px-1.5 py-0.2 rounded inline-block"
                   :class="currentUser.role === 'LEADER' ? 'bg-amber-500/10 text-amber-400 border border-amber-500/20' : 'bg-emerald-500/10 text-emerald-400 border border-emerald-500/20'"
                   x-text="currentUser.role"></div>
            </div>
            <button @click="logout()" title="Sign Out" class="p-2 text-slate-400 hover:text-rose-400 hover:bg-slate-800/60 rounded-lg transition">
              <i data-lucide="log-out" class="w-4 h-4"></i>
            </button>
          </div>
        </template>

        <!-- Unauthenticated Sign In Buttons -->
        <template x-if="!currentUser">
          <div class="flex items-center space-x-2">
            <button @click="authModal = true; authMode = 'login'" class="px-3 py-1.5 text-xs font-medium text-slate-300 hover:text-white transition">Sign In</button>
            <button @click="authModal = true; authMode = 'register'" class="px-3 py-1.5 text-xs font-semibold bg-sky-600 hover:bg-sky-500 text-white rounded-lg transition shadow-md shadow-sky-600/20">Register</button>
          </div>
        </template>

      </div>
    </div>
  </header>

  <!-- Main Content Area -->
  <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6 space-y-6">

    <!-- Hero / Welcome Banner for Unauthenticated State -->
    <template x-if="!currentUser">
      <div class="bg-gradient-to-b from-dark-900 to-dark-850 border border-slate-800 rounded-3xl p-8 sm:p-12 shadow-2xl relative overflow-hidden">
        <div class="max-w-2xl space-y-4">
          <div class="inline-flex items-center space-x-2 px-3 py-1 bg-sky-500/10 border border-sky-500/20 rounded-full text-xs font-medium text-sky-400">
            <i data-lucide="check-check" class="w-3.5 h-3.5"></i>
            <span>Task Management & SLA Platform</span>
          </div>
          <h1 class="text-3xl sm:text-4xl font-extrabold tracking-tight text-white leading-tight">
            Streamlined task delegation with live read receipts.
          </h1>
          <p class="text-slate-400 text-sm sm:text-base leading-relaxed">
            Assign deliverables, track exact timestamps when team members view tasks, and sign off on completed work with a full audit trail.
          </p>
          <div class="pt-3 flex flex-wrap items-center gap-3">
            <button @click="quickLogin('leader@trackly.io', 'leader123', 'LEADER')" class="px-4 py-2.5 text-xs font-semibold bg-sky-600 hover:bg-sky-500 text-white rounded-xl transition shadow-lg shadow-sky-600/25 flex items-center space-x-2">
              <i data-lucide="shield" class="w-4 h-4"></i>
              <span>Enter as Team Leader</span>
            </button>
            <button @click="quickLogin('member@trackly.io', 'member123', 'MEMBER')" class="px-4 py-2.5 text-xs font-semibold bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700/80 rounded-xl transition flex items-center space-x-2">
              <i data-lucide="user" class="w-4 h-4"></i>
              <span>Enter as Member</span>
            </button>
          </div>
        </div>
      </div>
    </template>

    <!-- Authenticated Dashboard -->
    <template x-if="currentUser">
      <div class="space-y-6">
        
        <!-- Summary Counters -->
        <div class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-6 gap-3">
          <div @click="filterStatus = ''; fetchTasks()" class="bg-dark-900 border border-slate-800/80 hover:border-slate-700 p-3.5 rounded-2xl cursor-pointer transition flex flex-col">
            <span class="text-[11px] font-medium text-slate-400">Total Tasks</span>
            <span class="text-2xl font-bold mt-1 text-white" x-text="metrics.total">0</span>
          </div>
          <div @click="filterStatus = 'TODO'; fetchTasks()" class="bg-dark-900 border border-slate-800/80 hover:border-slate-700 p-3.5 rounded-2xl cursor-pointer transition flex flex-col">
            <span class="text-[11px] font-medium text-slate-400">To Do</span>
            <span class="text-2xl font-bold mt-1 text-slate-300" x-text="metrics.todo">0</span>
          </div>
          <div @click="filterStatus = 'SEEN'; fetchTasks()" class="bg-dark-900 border border-slate-800/80 hover:border-sky-500/30 p-3.5 rounded-2xl cursor-pointer transition flex flex-col">
            <span class="text-[11px] font-medium text-sky-400">Seen (Read)</span>
            <span class="text-2xl font-bold mt-1 text-sky-400" x-text="metrics.seen">0</span>
          </div>
          <div @click="filterStatus = 'IN_PROGRESS'; fetchTasks()" class="bg-dark-900 border border-slate-800/80 hover:border-indigo-500/30 p-3.5 rounded-2xl cursor-pointer transition flex flex-col">
            <span class="text-[11px] font-medium text-indigo-400">In Progress</span>
            <span class="text-2xl font-bold mt-1 text-indigo-400" x-text="metrics.in_progress">0</span>
          </div>
          <div @click="filterStatus = 'PENDING_REVIEW'; fetchTasks()" class="bg-dark-900 border border-slate-800/80 hover:border-amber-500/30 p-3.5 rounded-2xl cursor-pointer transition flex flex-col">
            <span class="text-[11px] font-medium text-amber-400">Pending Review</span>
            <span class="text-2xl font-bold mt-1 text-amber-400" x-text="metrics.pending_review">0</span>
          </div>
          <div @click="filterStatus = 'COMPLETED'; fetchTasks()" class="bg-dark-900 border border-slate-800/80 hover:border-emerald-500/30 p-3.5 rounded-2xl cursor-pointer transition flex flex-col">
            <span class="text-[11px] font-medium text-emerald-400">Completed</span>
            <span class="text-2xl font-bold mt-1 text-emerald-400" x-text="metrics.completed">0</span>
          </div>
        </div>

        <!-- Filter Tabs & Create Task Button -->
        <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3 bg-dark-900/60 border border-slate-800/80 p-2.5 rounded-2xl">
          <!-- Filter Tabs -->
          <div class="flex items-center space-x-1 overflow-x-auto text-xs pb-1 sm:pb-0">
            <button @click="filterStatus = ''; fetchTasks()" :class="filterStatus === '' ? 'bg-sky-600 text-white shadow-sm' : 'text-slate-400 hover:text-slate-200'" class="px-3 py-1.5 rounded-lg font-medium transition whitespace-nowrap">All</button>
            <button @click="filterStatus = 'TODO'; fetchTasks()" :class="filterStatus === 'TODO' ? 'bg-sky-600 text-white shadow-sm' : 'text-slate-400 hover:text-slate-200'" class="px-3 py-1.5 rounded-lg font-medium transition whitespace-nowrap">To Do</button>
            <button @click="filterStatus = 'SEEN'; fetchTasks()" :class="filterStatus === 'SEEN' ? 'bg-sky-600 text-white shadow-sm' : 'text-slate-400 hover:text-slate-200'" class="px-3 py-1.5 rounded-lg font-medium transition whitespace-nowrap">Seen</button>
            <button @click="filterStatus = 'IN_PROGRESS'; fetchTasks()" :class="filterStatus === 'IN_PROGRESS' ? 'bg-sky-600 text-white shadow-sm' : 'text-slate-400 hover:text-slate-200'" class="px-3 py-1.5 rounded-lg font-medium transition whitespace-nowrap">In Progress</button>
            <button @click="filterStatus = 'PENDING_REVIEW'; fetchTasks()" :class="filterStatus === 'PENDING_REVIEW' ? 'bg-sky-600 text-white shadow-sm' : 'text-slate-400 hover:text-slate-200'" class="px-3 py-1.5 rounded-lg font-medium transition whitespace-nowrap">Review</button>
            <button @click="filterStatus = 'COMPLETED'; fetchTasks()" :class="filterStatus === 'COMPLETED' ? 'bg-sky-600 text-white shadow-sm' : 'text-slate-400 hover:text-slate-200'" class="px-3 py-1.5 rounded-lg font-medium transition whitespace-nowrap">Done</button>
          </div>

          <!-- Right Action Controls -->
          <div class="flex items-center space-x-2 self-end sm:self-auto">
            <select x-model="filterPriority" @change="fetchTasks()" class="bg-slate-800/80 border border-slate-700/80 text-xs rounded-xl px-2.5 py-1.5 text-slate-300 focus:outline-none focus:border-sky-500">
              <option value="">All Priorities</option>
              <option value="CRITICAL">Critical</option>
              <option value="HIGH">High</option>
              <option value="MEDIUM">Medium</option>
              <option value="LOW">Low</option>
            </select>

            <template x-if="currentUser.role === 'LEADER'">
              <button @click="openCreateTaskModal()" class="px-3.5 py-1.5 text-xs font-semibold bg-sky-600 hover:bg-sky-500 text-white rounded-xl transition flex items-center space-x-1.5 shadow-md shadow-sky-600/25">
                <i data-lucide="plus" class="w-4 h-4"></i>
                <span>New Task</span>
              </button>
            </template>
          </div>
        </div>

        <!-- Task List Feed -->
        <div class="space-y-2.5">
          <template x-if="tasks.length === 0">
            <div class="bg-dark-900 border border-slate-800/80 rounded-2xl p-12 text-center">
              <i data-lucide="inbox" class="w-10 h-10 text-slate-600 mx-auto mb-3"></i>
              <h3 class="text-sm font-semibold text-slate-300">No tasks found</h3>
              <p class="text-xs text-slate-500 mt-1 max-w-sm mx-auto">Create a task or clear filters to view your assignments.</p>
            </div>
          </template>

          <template x-for="task in tasks" :key="task.id">
            <div class="bg-dark-900 border border-slate-800/80 hover:border-slate-700 rounded-2xl p-4 transition-all duration-150 flex flex-col md:flex-row md:items-center justify-between gap-3.5">
              
              <!-- Left Details -->
              <div class="space-y-1.5 flex-1 min-w-0 cursor-pointer" @click="openTaskDetail(task.id)">
                <div class="flex flex-wrap items-center gap-1.5">
                  
                  <!-- Priority badge -->
                  <span class="text-[10px] font-bold px-2 py-0.5 rounded-md uppercase"
                        :class="getPriorityClass(task.priority)"
                        x-text="task.priority"></span>
                  
                  <!-- Status badge -->
                  <span class="text-[10px] font-semibold px-2 py-0.5 rounded-md"
                        :class="getStatusClass(task.status)"
                        x-text="task.status.replace('_', ' ')"></span>
                  
                  <!-- Read receipt -->
                  <template x-if="task.seen_at">
                    <span class="inline-flex items-center space-x-1 text-[10px] text-sky-400 bg-sky-500/10 px-2 py-0.5 rounded-md border border-sky-500/20" :title="'Seen at ' + formatDate(task.seen_at)">
                      <i data-lucide="eye" class="w-3 h-3"></i>
                      <span>Read</span>
                    </span>
                  </template>
                  <template x-if="!task.seen_at">
                    <span class="inline-flex items-center space-x-1 text-[10px] text-slate-500 bg-slate-800/60 px-2 py-0.5 rounded-md">
                      <i data-lucide="eye-off" class="w-3 h-3"></i>
                      <span>Unseen</span>
                    </span>
                  </template>

                  <!-- Database URL Badge (if present) -->
                  <template x-if="extractDbUrl(task.description)">
                    <a :href="extractDbUrl(task.description)" target="_blank" @click.stop class="inline-flex items-center space-x-1 text-[10px] text-indigo-400 bg-indigo-500/10 hover:bg-indigo-500/20 px-2 py-0.5 rounded-md border border-indigo-500/25 transition">
                      <i data-lucide="database" class="w-3 h-3"></i>
                      <span>Database / Resource</span>
                    </a>
                  </template>
                </div>

                <h3 class="text-sm font-semibold text-slate-100 hover:text-sky-400 transition truncate" x-text="task.title"></h3>
                <p class="text-xs text-slate-400 line-clamp-1" x-text="cleanDescription(task.description) || 'No description provided'"></p>

                <div class="flex items-center space-x-4 text-[11px] text-slate-500 pt-1">
                  <span class="flex items-center space-x-1">
                    <i data-lucide="user" class="w-3.5 h-3.5 text-slate-400"></i>
                    <span>Assignee: <strong class="text-slate-300" x-text="task.assignee ? task.assignee.full_name : 'Unassigned'"></strong></span>
                  </span>
                  <span class="flex items-center space-x-1">
                    <i data-lucide="calendar" class="w-3.5 h-3.5 text-slate-400"></i>
                    <span :class="isOverdue(task.due_date) ? 'text-rose-400 font-semibold' : ''" x-text="task.due_date ? 'Due ' + formatDate(task.due_date) : 'No due date'"></span>
                  </span>
                </div>
              </div>

              <!-- Right Actions -->
              <div class="flex items-center space-x-2 shrink-0">
                <button @click="openTaskDetail(task.id)" class="px-3 py-1.5 text-xs font-medium bg-slate-800 hover:bg-slate-700 text-slate-200 rounded-xl transition flex items-center space-x-1">
                  <i data-lucide="external-link" class="w-3.5 h-3.5"></i>
                  <span>Inspect</span>
                </button>

                <!-- Quick Action based on status & role -->
                <template x-if="currentUser.role === 'MEMBER' && task.status !== 'COMPLETED' && task.status !== 'PENDING_REVIEW'">
                  <button @click="quickUpdateStatus(task, 'PENDING_REVIEW')" class="px-3 py-1.5 text-xs font-semibold bg-amber-600/20 hover:bg-amber-600/30 text-amber-300 border border-amber-500/30 rounded-xl transition">
                    Submit Review
                  </button>
                </template>

                <template x-if="currentUser.role === 'LEADER' && task.status === 'PENDING_REVIEW'">
                  <button @click="quickUpdateStatus(task, 'COMPLETED')" class="px-3 py-1.5 text-xs font-semibold bg-emerald-600 hover:bg-emerald-500 text-white rounded-xl transition flex items-center space-x-1 shadow-md shadow-emerald-600/20">
                    <i data-lucide="check-circle" class="w-3.5 h-3.5"></i>
                    <span>Sign Off</span>
                  </button>
                </template>
              </div>
            </div>
          </template>
        </div>
      </div>
    </template>
  </main>

  <!-- Create Task Modal -->
  <div x-show="createModal" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/80 backdrop-blur-sm" x-cloak>
    <div @click.away="createModal = false" class="bg-dark-900 border border-slate-800 rounded-2xl w-full max-w-lg p-6 space-y-4 shadow-2xl">
      <div class="flex items-center justify-between border-b border-slate-800 pb-3">
        <h3 class="text-sm font-bold text-white flex items-center space-x-2">
          <i data-lucide="clipboard-list" class="w-4 h-4 text-sky-400"></i>
          <span>Create & Delegate Task</span>
        </h3>
        <button @click="createModal = false" class="text-slate-400 hover:text-white"><i data-lucide="x" class="w-5 h-5"></i></button>
      </div>

      <form @submit.prevent="submitCreateTask()" class="space-y-3.5 text-xs">
        <div>
          <label class="block font-medium text-slate-300 mb-1">Task Title *</label>
          <input type="text" x-model="newTask.title" required placeholder="e.g. Migrate database to Neon PostgreSQL" class="w-full bg-dark-950 border border-slate-800 rounded-xl px-3 py-2 text-slate-100 focus:outline-none focus:border-sky-500 text-xs">
        </div>

        <div>
          <label class="block font-medium text-slate-300 mb-1">Description & Requirements</label>
          <textarea x-model="newTask.description" rows="2" placeholder="Instructions, scope, deliverables..." class="w-full bg-dark-950 border border-slate-800 rounded-xl px-3 py-2 text-slate-100 focus:outline-none focus:border-sky-500 text-xs"></textarea>
        </div>

        <!-- Place to Add URL / Database -->
        <div>
          <label class="block font-medium text-slate-300 mb-1 flex items-center space-x-1.5">
            <i data-lucide="database" class="w-3.5 h-3.5 text-indigo-400"></i>
            <span>Database URL / Resource Link (Optional)</span>
          </label>
          <input type="text" x-model="newTask.db_url" placeholder="e.g. postgresql://user:pass@host/db or https://neon.tech/..." class="w-full bg-dark-950 border border-slate-800 rounded-xl px-3 py-2 text-slate-100 focus:outline-none focus:border-sky-500 text-xs font-mono">
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block font-medium text-slate-300 mb-1">Priority</label>
            <select x-model="newTask.priority" class="w-full bg-dark-950 border border-slate-800 rounded-xl px-3 py-2 text-slate-100 focus:outline-none text-xs">
              <option value="LOW">Low</option>
              <option value="MEDIUM" selected>Medium</option>
              <option value="HIGH">High</option>
              <option value="CRITICAL">Critical</option>
            </select>
          </div>
          <div>
            <label class="block font-medium text-slate-300 mb-1">Assignee</label>
            <select x-model="newTask.assignee_id" class="w-full bg-dark-950 border border-slate-800 rounded-xl px-3 py-2 text-slate-100 focus:outline-none text-xs">
              <option value="">Select Assignee</option>
              <template x-for="m in members" :key="m.id">
                <option :value="m.id" x-text="m.full_name"></option>
              </template>
            </select>
          </div>
        </div>

        <div>
          <label class="block font-medium text-slate-300 mb-1">Deadline SLA</label>
          <input type="datetime-local" x-model="newTask.due_date" class="w-full bg-dark-950 border border-slate-800 rounded-xl px-3 py-2 text-slate-100 focus:outline-none text-xs">
        </div>

        <div class="pt-3 border-t border-slate-800 flex justify-end space-x-2">
          <button type="button" @click="createModal = false" class="px-3.5 py-1.5 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-xl transition">Cancel</button>
          <button type="submit" class="px-4 py-1.5 bg-sky-600 hover:bg-sky-500 text-white font-semibold rounded-xl transition shadow-md shadow-sky-600/20">Delegate Task</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Task Detail & Timeline Modal -->
  <div x-show="detailModal" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/80 backdrop-blur-sm" x-cloak>
    <div @click.away="detailModal = false" class="bg-dark-900 border border-slate-800 rounded-2xl w-full max-w-2xl max-h-[90vh] flex flex-col shadow-2xl overflow-hidden">
      <!-- Modal Header -->
      <div class="p-5 border-b border-slate-800 flex items-start justify-between bg-dark-850">
        <div class="space-y-1 flex-1 pr-4">
          <div class="flex items-center space-x-2">
            <span class="text-[10px] font-bold px-2 py-0.5 rounded-md uppercase" :class="getPriorityClass(activeTask?.priority)" x-text="activeTask?.priority"></span>
            <span class="text-[10px] font-semibold px-2 py-0.5 rounded-md" :class="getStatusClass(activeTask?.status)" x-text="activeTask?.status?.replace('_', ' ')"></span>
            <template x-if="activeTask?.seen_at">
              <span class="text-[10px] text-emerald-400 bg-emerald-500/10 px-2 py-0.5 rounded-md border border-emerald-500/20 flex items-center space-x-1">
                <i data-lucide="check" class="w-3 h-3"></i>
                <span x-text="'Read ' + formatDate(activeTask?.seen_at)"></span>
              </span>
            </template>
          </div>
          <h2 class="text-base font-bold text-white pt-1" x-text="activeTask?.title"></h2>
        </div>
        <button @click="detailModal = false" class="text-slate-400 hover:text-white p-1 rounded"><i data-lucide="x" class="w-5 h-5"></i></button>
      </div>

      <!-- Modal Body -->
      <div class="p-5 overflow-y-auto space-y-5 flex-1 text-xs">
        
        <!-- Summary Info Grid -->
        <div class="grid grid-cols-3 gap-2 bg-dark-950 p-3.5 rounded-xl border border-slate-800/80">
          <div>
            <div class="text-slate-500 text-[10px]">Leader</div>
            <div class="font-semibold text-slate-200 mt-0.5" x-text="activeTask?.leader?.full_name"></div>
          </div>
          <div>
            <div class="text-slate-500 text-[10px]">Assignee</div>
            <div class="font-semibold text-slate-200 mt-0.5" x-text="activeTask?.assignee ? activeTask.assignee.full_name : 'Unassigned'"></div>
          </div>
          <div>
            <div class="text-slate-500 text-[10px]">Deadline</div>
            <div class="font-semibold text-slate-200 mt-0.5" x-text="activeTask?.due_date ? formatDate(activeTask.due_date) : 'None'"></div>
          </div>
        </div>

        <!-- Description -->
        <div>
          <h4 class="font-bold text-slate-300 uppercase tracking-wider text-[10px] mb-1.5">Description</h4>
          <div class="bg-dark-950 p-3.5 rounded-xl border border-slate-800/80 text-slate-300 leading-relaxed whitespace-pre-wrap" x-text="cleanDescription(activeTask?.description) || 'No description provided.'"></div>
        </div>

        <!-- Database Link (if attached) -->
        <template x-if="extractDbUrl(activeTask?.description)">
          <div>
            <h4 class="font-bold text-slate-300 uppercase tracking-wider text-[10px] mb-1.5 flex items-center space-x-1">
              <i data-lucide="database" class="w-3.5 h-3.5 text-indigo-400"></i>
              <span>Attached Database / Resource URL</span>
            </h4>
            <div class="bg-dark-950 p-3 rounded-xl border border-slate-800/80 flex items-center justify-between">
              <span class="text-indigo-300 font-mono text-[11px] truncate mr-2" x-text="extractDbUrl(activeTask?.description)"></span>
              <a :href="extractDbUrl(activeTask?.description)" target="_blank" class="px-2.5 py-1 text-[11px] bg-indigo-600/20 text-indigo-300 hover:bg-indigo-600/30 rounded-lg border border-indigo-500/30 shrink-0">Open Link</a>
            </div>
          </div>
        </template>

        <!-- Status Workflow Controls -->
        <div class="bg-dark-850 p-3.5 rounded-xl border border-slate-800/80 space-y-2.5">
          <h4 class="font-bold text-slate-200 uppercase tracking-wider text-[10px]">Status Workflow</h4>
          <div class="flex flex-wrap items-center gap-2">
            <!-- Member Actions -->
            <template x-if="currentUser?.role === 'MEMBER' && activeTask?.assignee_id === currentUser?.id">
              <div class="flex flex-wrap gap-2">
                <button x-show="activeTask?.status === 'SEEN' || activeTask?.status === 'TODO'" @click="updateTaskStatus(activeTask.id, 'IN_PROGRESS', 'Initiated work.')" class="px-3 py-1.5 bg-indigo-600 hover:bg-indigo-500 text-white font-medium rounded-lg transition">Start Work</button>
                <button x-show="activeTask?.status === 'IN_PROGRESS'" @click="updateTaskStatus(activeTask.id, 'PENDING_REVIEW', prompt('Enter deliverables or note for Leader verification:') || 'Ready for review')" class="px-3 py-1.5 bg-amber-600 hover:bg-amber-500 text-white font-medium rounded-lg transition">Submit For Review</button>
              </div>
            </template>

            <!-- Leader Verification Actions -->
            <template x-if="currentUser?.role === 'LEADER'">
              <div class="flex flex-wrap gap-2">
                <button x-show="activeTask?.status === 'PENDING_REVIEW'" @click="updateTaskStatus(activeTask.id, 'COMPLETED', 'Approved deliverables.')" class="px-3 py-1.5 bg-emerald-600 hover:bg-emerald-500 text-white font-semibold rounded-lg transition flex items-center space-x-1 shadow-md shadow-emerald-600/20">
                  <i data-lucide="check" class="w-3.5 h-3.5"></i>
                  <span>Approve & Complete</span>
                </button>
                <button x-show="activeTask?.status === 'PENDING_REVIEW'" @click="updateTaskStatus(activeTask.id, 'IN_PROGRESS', prompt('Reason for revision:') || 'Revisions requested.')" class="px-3 py-1.5 bg-rose-600/20 hover:bg-rose-600/30 text-rose-300 border border-rose-500/30 font-medium rounded-lg transition">
                  Request Revision
                </button>
              </div>
            </template>
          </div>
        </div>

        <!-- Activity Audit Trail -->
        <div class="space-y-2.5">
          <h4 class="font-bold text-slate-300 uppercase tracking-wider text-[10px] flex items-center space-x-1.5">
            <i data-lucide="history" class="w-3.5 h-3.5 text-sky-400"></i>
            <span>Activity Trail</span>
          </h4>

          <div class="space-y-2 border-l border-slate-800 ml-2.5 pl-3.5">
            <template x-for="up in activeTask?.updates || []" :key="up.id">
              <div class="relative group">
                <div class="absolute -left-[19px] top-1.5 w-2 h-2 rounded-full bg-sky-500"></div>
                <div class="bg-dark-950 p-2.5 rounded-lg border border-slate-800/80 space-y-1">
                  <div class="flex items-center justify-between text-[11px]">
                    <span class="font-semibold text-slate-200" x-text="up.user ? up.user.full_name : 'System'"></span>
                    <span class="text-slate-500 text-[10px]" x-text="formatDate(up.created_at)"></span>
                  </div>
                  <p class="text-slate-300" x-text="up.message"></p>
                </div>
              </div>
            </template>
          </div>

          <!-- Add Note Form -->
          <form @submit.prevent="submitTaskComment()" class="pt-2 flex gap-2">
            <input type="text" x-model="commentText" placeholder="Post a progress note..." required class="flex-1 bg-dark-950 border border-slate-800 rounded-xl px-3 py-1.5 text-slate-200 focus:outline-none focus:border-sky-500 text-xs">
            <button type="submit" class="px-3 py-1.5 bg-sky-600 hover:bg-sky-500 text-white rounded-xl transition font-medium text-xs">Post</button>
          </form>
        </div>
      </div>
    </div>
  </div>

  <!-- Discreet Database & Backend Settings Modal -->
  <div x-show="apiSettingsModal" x-transition class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/80 backdrop-blur-sm" x-cloak>
    <div @click.away="apiSettingsModal = false" class="bg-dark-900 border border-slate-800 rounded-2xl max-w-md w-full p-6 shadow-2xl space-y-4">
      <div class="flex items-center justify-between border-b border-slate-800 pb-3">
        <div class="flex items-center space-x-2">
          <div class="p-2 bg-sky-500/10 text-sky-400 rounded-lg">
            <i data-lucide="database" class="w-4 h-4"></i>
          </div>
          <h3 class="font-bold text-sm text-white">Database & API Settings</h3>
        </div>
        <button @click="apiSettingsModal = false" class="text-slate-400 hover:text-white p-1 rounded-lg">
          <i data-lucide="x" class="w-4 h-4"></i>
        </button>
      </div>

      <div class="text-xs text-slate-400 space-y-2">
        <p>Set the address of your backend server or cloud API endpoint.</p>
        <p class="text-[11px] text-slate-500">Default for local testing: <code class="text-sky-400">http://127.0.0.1:8000</code></p>
      </div>

      <div class="space-y-1">
        <label class="block text-xs font-medium text-slate-300">Server / API URL</label>
        <input type="text" x-model="tempApiUrl" placeholder="http://127.0.0.1:8000" class="w-full bg-dark-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-slate-100 placeholder-slate-600 focus:outline-none focus:border-sky-500 font-mono">
      </div>

      <div class="flex items-center justify-between text-xs pt-2">
        <div class="flex items-center space-x-1.5">
          <span class="w-2 h-2 rounded-full" :class="apiStatus === 'connected' ? 'bg-emerald-400' : 'bg-rose-400'"></span>
          <span class="text-slate-400" x-text="'Status: ' + (apiStatus === 'connected' ? 'Reachable' : 'Offline')"></span>
        </div>
        <div class="flex space-x-2">
          <button type="button" @click="apiSettingsModal = false" class="px-3 py-1.5 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-xl transition">Cancel</button>
          <button type="button" @click="saveApiConfig()" class="px-3.5 py-1.5 bg-sky-600 hover:bg-sky-500 text-white font-medium rounded-xl transition shadow-md shadow-sky-600/20">Save</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Auth Modal (Sign In / Register) -->
  <div x-show="authModal" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/80 backdrop-blur-sm" x-cloak>
    <div @click.away="authModal = false" class="bg-dark-900 border border-slate-800 rounded-2xl w-full max-w-md p-6 space-y-4 shadow-2xl">
      <div class="flex items-center justify-between border-b border-slate-800 pb-3">
        <h3 class="text-sm font-bold text-white" x-text="authMode === 'login' ? 'Sign In' : 'Create Account'"></h3>
        <button @click="authModal = false" class="text-slate-400 hover:text-white"><i data-lucide="x" class="w-5 h-5"></i></button>
      </div>

      <form @submit.prevent="submitAuth()" class="space-y-3 text-xs">
        <template x-if="authMode === 'register'">
          <div>
            <label class="block font-medium text-slate-300 mb-1">Full Name</label>
            <input type="text" x-model="authForm.full_name" required placeholder="Alex Mercer" class="w-full bg-dark-950 border border-slate-800 rounded-xl px-3 py-2 text-slate-100 focus:outline-none focus:border-sky-500 text-xs">
          </div>
        </template>

        <div>
          <label class="block font-medium text-slate-300 mb-1">Email</label>
          <input type="email" x-model="authForm.email" required placeholder="alex@company.com" class="w-full bg-dark-950 border border-slate-800 rounded-xl px-3 py-2 text-slate-100 focus:outline-none focus:border-sky-500 text-xs">
        </div>

        <div>
          <label class="block font-medium text-slate-300 mb-1">Password</label>
          <input type="password" x-model="authForm.password" required placeholder="••••••••" class="w-full bg-dark-950 border border-slate-800 rounded-xl px-3 py-2 text-slate-100 focus:outline-none focus:border-sky-500 text-xs">
        </div>

        <template x-if="authMode === 'register'">
          <div>
            <label class="block font-medium text-slate-300 mb-1">Role</label>
            <select x-model="authForm.role" class="w-full bg-dark-950 border border-slate-800 rounded-xl px-3 py-2 text-slate-100 focus:outline-none text-xs">
              <option value="MEMBER">Team Member (Executor)</option>
              <option value="LEADER">Team Leader (Assigner)</option>
            </select>
          </div>
        </template>

        <div class="pt-2">
          <button type="submit" class="w-full py-2 bg-sky-600 hover:bg-sky-500 text-white font-semibold rounded-xl transition shadow-md shadow-sky-600/20" x-text="authMode === 'login' ? 'Sign In' : 'Create Account'"></button>
        </div>

        <div class="text-center text-[11px] text-slate-400">
          <span x-text="authMode === 'login' ? 'Need an account?' : 'Already have an account?'"></span>
          <button type="button" @click="authMode = authMode === 'login' ? 'register' : 'login'" class="text-sky-400 font-semibold hover:underline ml-1" x-text="authMode === 'login' ? 'Register here' : 'Sign in'"></button>
        </div>
      </form>
    </div>
  </div>

  <!-- Notification Toast -->
  <div x-show="toast.show" x-transition class="fixed bottom-5 right-5 z-50 bg-dark-900 border border-sky-500/40 text-slate-100 px-4 py-2.5 rounded-xl shadow-2xl flex items-center space-x-2 text-xs" x-cloak>
    <i data-lucide="info" class="w-4 h-4 text-sky-400"></i>
    <span x-text="toast.message"></span>
  </div>

  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
