# ==========================================================
# Render Blueprint Deployment Configuration
# Monorepo: Frontend Static Site + Backend FastAPI Web Service
# https://render.com/docs/blueprint-spec
# ==========================================================

services:
  # --------------------------------------------------------
  # 1. Backend Web Service (FastAPI + SQLAlchemy + Asyncpg)
  # --------------------------------------------------------
  - type: web
    name: taskpulse-backend
    runtime: python
    rootDir: backend
    region: oregon
    plan: starter
    buildCommand: "pip install -r requirements.txt && alembic upgrade head"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.8
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      - key: SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: "*"
      - key: DATABASE_URL
        fromDatabase:
          name: taskpulse-db
          property: connectionString
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM_EMAIL
        value: "TaskPulse <notifications@taskpulse.io>"
      - key: SMTP_TLS
        value: "true"

  # --------------------------------------------------------
  # 2. Frontend Static Site (Tailwind CSS + Alpine.js SPA)
  # --------------------------------------------------------
  - type: web
    name: taskpulse-frontend
    runtime: static
    rootDir: frontend
    staticPublishPath: .
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: Cache-Control
        value: no-cache

# ----------------------------------------------------------
# 3. Managed PostgreSQL Database
# ----------------------------------------------------------
databases:
  - name: taskpulse-db
    databaseName: taskpulse
    user: taskpulse
    region: oregon
    plan: free
    ipAllowList: [] # Allows access only from Render internal network
