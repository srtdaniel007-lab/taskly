<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TaskPulse | Operational Task & Delegation Hub</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#f0f9ff',
              100: '#e0f2fe',
              500: '#0ea5e9',
              600: '#0284c7',
              700: '#0369a1',
            },
            slate: {
              850: '#151e2e',
              900: '#0f172a',
              950: '#080d1a',
            }
          }
        }
      }
    }
  </script>
  <!-- Alpine.js -->
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.13.5/dist/cdn.min.js"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    [x-cloak] { display: none !important; }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #0f172a; }
    ::-webkit-scrollbar-thumb { background: #334155; border-radius: 3px; }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen antialiased flex flex-col font-sans" x-data="taskPulseApp()" x-init="initApp()" x-cloak>

  <!-- Top Navigation Bar -->
  <header class="sticky top-0 z-40 bg-slate-900/90 backdrop-blur border-b border-slate-800">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
      <!-- Logo -->
      <div class="flex items-center space-x-3">
        <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-sky-500 to-indigo-600 flex items-center justify-center shadow-lg shadow-sky-500/20">
          <i data-lucide="zap" class="w-5 h-5 text-white"></i>
        </div>
        <div>
          <span class="text-xl font-bold tracking-tight bg-gradient-to-r from-sky-400 via-indigo-300 to-white bg-clip-text text-transparent">TaskPulse</span>
          <span class="hidden sm:inline-block ml-2 px-2 py-0.5 text-[10px] font-semibold tracking-wide uppercase bg-sky-500/10 text-sky-400 border border-sky-500/20 rounded">OpsLead</span>
        </div>
      </div>

      <!-- User & Actions Area -->
      <div class="flex items-center space-x-4">
        <!-- Notification Bell Dropdown -->
        <template x-if="currentUser">
          <div class="relative" x-data="{ open: false }">
            <button @click="open = !open" class="relative p-2 text-slate-400 hover:text-slate-100 hover:bg-slate-800 rounded-lg transition-colors">
              <i data-lucide="bell" class="w-5 h-5"></i>
              <span x-show="unreadCount > 0" x-text="unreadCount" class="absolute -top-1 -right-1 px-1.5 py-0.5 text-[10px] font-bold bg-rose-500 text-white rounded-full min-w-[18px] text-center shadow-lg"></span>
            </button>

            <!-- Notifications Flyout -->
            <div x-show="open" @click.away="open = false" class="absolute right-0 mt-2 w-80 sm:w-96 bg-slate-900 border border-slate-800 rounded-xl shadow-2xl p-4 z-50">
              <div class="flex items-center justify-between border-b border-slate-800 pb-3 mb-3">
                <div class="flex items-center space-x-2">
                  <span class="font-semibold text-sm">Notifications</span>
                  <span class="px-2 py-0.5 text-xs bg-slate-800 text-slate-300 rounded-full" x-text="unreadCount + ' unread'"></span>
                </div>
                <button @click="markAllNotificationsRead()" class="text-xs text-sky-400 hover:underline">Mark all read</button>
              </div>

              <div class="space-y-2 max-h-72 overflow-y-auto pr-1">
                <template x-if="notifications.length === 0">
                  <p class="text-xs text-slate-500 text-center py-6">No notifications yet</p>
                </template>
                <template x-for="notif in notifications" :key="notif.id">
                  <div :class="notif.is_read ? 'opacity-60 bg-slate-900' : 'bg-slate-800/80 border-l-2 border-sky-400'" class="p-2.5 rounded-lg text-xs transition flex flex-col space-y-1">
                    <p class="text-slate-200" x-text="notif.message"></p>
                    <div class="flex items-center justify-between text-[10px] text-slate-500">
                      <span x-text="formatDate(notif.created_at)"></span>
                      <button x-show="!notif.is_read" @click="markNotificationRead(notif.id)" class="text-sky-400 hover:underline">Mark read</button>
                    </div>
                  </div>
                </template>
              </div>
            </div>
          </div>
        </template>

        <!-- Authenticated Profile / Role -->
        <template x-if="currentUser">
          <div class="flex items-center space-x-3">
            <div class="text-right hidden sm:block">
              <div class="text-xs font-semibold text-slate-200" x-text="currentUser.full_name"></div>
              <div class="text-[10px] font-mono tracking-wide uppercase px-1.5 py-0.2 rounded inline-block"
                   :class="currentUser.role === 'LEADER' ? 'bg-amber-500/10 text-amber-400 border border-amber-500/20' : 'bg-emerald-500/10 text-emerald-400 border border-emerald-500/20'"
                   x-text="currentUser.role"></div>
            </div>
            <button @click="logout()" class="px-3 py-1.5 text-xs font-medium bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-lg transition">
              Sign Out
            </button>
          </div>
        </template>

        <!-- Unauthenticated CTA -->
        <template x-if="!currentUser">
          <div class="flex items-center space-x-2">
            <button @click="authModal = true; authMode = 'login'" class="px-3 py-1.5 text-xs font-medium text-slate-300 hover:text-white transition">Sign In</button>
            <button @click="authModal = true; authMode = 'register'" class="px-3.5 py-1.5 text-xs font-semibold bg-sky-600 hover:bg-sky-500 text-white rounded-lg transition shadow-md shadow-sky-600/20">Register</button>
          </div>
        </template>
      </div>
    </div>
  </header>

  <!-- Main Body -->
  <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8 space-y-6">

    <!-- Unauthenticated Banner / Quick Start -->
    <template x-if="!currentUser">
      <div class="bg-gradient-to-r from-slate-900 via-slate-850 to-slate-900 border border-slate-800 rounded-2xl p-8 sm:p-10 shadow-2xl relative overflow-hidden">
        <div class="relative z-10 max-w-2xl space-y-4">
          <div class="inline-flex items-center space-x-2 px-3 py-1 bg-sky-500/10 border border-sky-500/20 rounded-full text-xs font-medium text-sky-400">
            <i data-lucide="sparkles" class="w-3.5 h-3.5"></i>
            <span>Enterprise Task Delegation & SLA Tracker</span>
          </div>
          <h1 class="text-3xl sm:text-4xl font-extrabold tracking-tight text-white">
            Real-time assignment, read receipts & leader sign-offs.
          </h1>
          <p class="text-slate-400 text-sm sm:text-base leading-relaxed">
            Eliminate ambiguity in delegated tasks. Track exactly when assignees open deliverables, log audit trails, and approve completions with confidence.
          </p>
          <div class="pt-4 flex flex-wrap items-center gap-3">
            <button @click="quickLogin('leader@taskpulse.io', 'leader123', 'LEADER')" class="px-4 py-2.5 text-xs font-semibold bg-sky-600 hover:bg-sky-500 text-white rounded-xl transition shadow-lg shadow-sky-600/30 flex items-center space-x-2">
              <i data-lucide="crown" class="w-4 h-4"></i>
              <span>Demo as Team Leader</span>
            </button>
            <button @click="quickLogin('member@taskpulse.io', 'member123', 'MEMBER')" class="px-4 py-2.5 text-xs font-semibold bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 rounded-xl transition flex items-center space-x-2">
              <i data-lucide="user-check" class="w-4 h-4"></i>
              <span>Demo as Member</span>
            </button>
          </div>
        </div>
      </div>
    </template>

    <!-- Authenticated Dashboard -->
    <template x-if="currentUser">
      <div class="space-y-6">
        <!-- Top Metrics Row -->
        <div class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-6 gap-3">
          <div class="bg-slate-900 border border-slate-800 p-4 rounded-xl flex flex-col">
            <span class="text-xs font-medium text-slate-400">Total Tasks</span>
            <span class="text-2xl font-bold mt-1 text-white" x-text="metrics.total">0</span>
          </div>
          <div class="bg-slate-900 border border-slate-800 p-4 rounded-xl flex flex-col">
            <span class="text-xs font-medium text-slate-400">To Do</span>
            <span class="text-2xl font-bold mt-1 text-slate-300" x-text="metrics.todo">0</span>
          </div>
          <div class="bg-slate-900 border border-slate-800 p-4 rounded-xl flex flex-col">
            <span class="text-xs font-medium text-sky-400">Seen (Read)</span>
            <span class="text-2xl font-bold mt-1 text-sky-400" x-text="metrics.seen">0</span>
          </div>
          <div class="bg-slate-900 border border-slate-800 p-4 rounded-xl flex flex-col">
            <span class="text-xs font-medium text-indigo-400">In Progress</span>
            <span class="text-2xl font-bold mt-1 text-indigo-400" x-text="metrics.in_progress">0</span>
          </div>
          <div class="bg-slate-900 border border-slate-800 p-4 rounded-xl flex flex-col">
            <span class="text-xs font-medium text-amber-400">Pending Review</span>
            <span class="text-2xl font-bold mt-1 text-amber-400" x-text="metrics.pending_review">0</span>
          </div>
          <div class="bg-slate-900 border border-slate-800 p-4 rounded-xl flex flex-col">
            <span class="text-xs font-medium text-emerald-400">Completed</span>
            <span class="text-2xl font-bold mt-1 text-emerald-400" x-text="metrics.completed">0</span>
          </div>
        </div>

        <!-- Controls Bar: Filters & New Task Action -->
        <div class="flex flex-col md:flex-row md:items-center justify-between gap-4 bg-slate-900/60 border border-slate-800/80 p-3 rounded-xl">
          <!-- Status Tabs -->
          <div class="flex items-center space-x-1 overflow-x-auto text-xs pb-1 md:pb-0">
            <button @click="filterStatus = ''; fetchTasks()" :class="filterStatus === '' ? 'bg-sky-600 text-white' : 'text-slate-400 hover:text-slate-200'" class="px-3 py-1.5 rounded-lg font-medium transition whitespace-nowrap">All Tasks</button>
            <button @click="filterStatus = 'TODO'; fetchTasks()" :class="filterStatus === 'TODO' ? 'bg-sky-600 text-white' : 'text-slate-400 hover:text-slate-200'" class="px-3 py-1.5 rounded-lg font-medium transition whitespace-nowrap">To Do</button>
            <button @click="filterStatus = 'SEEN'; fetchTasks()" :class="filterStatus === 'SEEN' ? 'bg-sky-600 text-white' : 'text-slate-400 hover:text-slate-200'" class="px-3 py-1.5 rounded-lg font-medium transition whitespace-nowrap">Seen</button>
            <button @click="filterStatus = 'IN_PROGRESS'; fetchTasks()" :class="filterStatus === 'IN_PROGRESS' ? 'bg-sky-600 text-white' : 'text-slate-400 hover:text-slate-200'" class="px-3 py-1.5 rounded-lg font-medium transition whitespace-nowrap">In Progress</button>
            <button @click="filterStatus = 'PENDING_REVIEW'; fetchTasks()" :class="filterStatus === 'PENDING_REVIEW' ? 'bg-sky-600 text-white' : 'text-slate-400 hover:text-slate-200'" class="px-3 py-1.5 rounded-lg font-medium transition whitespace-nowrap">Pending Review</button>
            <button @click="filterStatus = 'COMPLETED'; fetchTasks()" :class="filterStatus === 'COMPLETED' ? 'bg-sky-600 text-white' : 'text-slate-400 hover:text-slate-200'" class="px-3 py-1.5 rounded-lg font-medium transition whitespace-nowrap">Completed</button>
          </div>

          <!-- Actions -->
          <div class="flex items-center space-x-3">
            <select x-model="filterPriority" @change="fetchTasks()" class="bg-slate-800 border border-slate-700 text-xs rounded-lg px-2.5 py-1.5 text-slate-300 focus:outline-none">
              <option value="">All Priorities</option>
              <option value="CRITICAL">Critical</option>
              <option value="HIGH">High</option>
              <option value="MEDIUM">Medium</option>
              <option value="LOW">Low</option>
            </select>

            <template x-if="currentUser.role === 'LEADER'">
              <button @click="openCreateTaskModal()" class="px-3.5 py-1.5 text-xs font-semibold bg-sky-600 hover:bg-sky-500 text-white rounded-lg transition flex items-center space-x-1.5 shadow-md shadow-sky-600/20">
                <i data-lucide="plus" class="w-4 h-4"></i>
                <span>Assign New Task</span>
              </button>
            </template>
          </div>
        </div>

        <!-- Task List Feed -->
        <div class="space-y-3">
          <template x-if="tasks.length === 0">
            <div class="bg-slate-900 border border-slate-800/80 rounded-2xl p-12 text-center">
              <i data-lucide="inbox" class="w-10 h-10 text-slate-600 mx-auto mb-3"></i>
              <h3 class="text-base font-semibold text-slate-300">No tasks found</h3>
              <p class="text-xs text-slate-500 mt-1 max-w-sm mx-auto">There are currently no tasks matching your filters. Create a task or switch status filters.</p>
            </div>
          </template>

          <template x-for="task in tasks" :key="task.id">
            <div class="bg-slate-900 border border-slate-800/80 hover:border-slate-700/80 rounded-xl p-4 transition-all duration-150 flex flex-col md:flex-row md:items-center justify-between gap-4">
              <!-- Left info -->
              <div class="space-y-1.5 flex-1 min-w-0 cursor-pointer" @click="openTaskDetail(task.id)">
                <div class="flex items-center space-x-2">
                  <!-- Priority badge -->
                  <span class="text-[10px] font-bold px-2 py-0.5 rounded-full uppercase"
                        :class="getPriorityClass(task.priority)"
                        x-text="task.priority"></span>
                  <!-- Status badge -->
                  <span class="text-[10px] font-semibold px-2 py-0.5 rounded-full"
                        :class="getStatusClass(task.status)"
                        x-text="task.status.replace('_', ' ')"></span>
                  <!-- Read receipt badge -->
                  <template x-if="task.seen_at">
                    <span class="inline-flex items-center space-x-1 text-[10px] text-sky-400 bg-sky-500/10 px-2 py-0.5 rounded border border-sky-500/20" :title="'Seen at ' + formatDate(task.seen_at)">
                      <i data-lucide="eye" class="w-3 h-3"></i>
                      <span>Read</span>
                    </span>
                  </template>
                  <template x-if="!task.seen_at">
                    <span class="inline-flex items-center space-x-1 text-[10px] text-slate-500 bg-slate-800 px-2 py-0.5 rounded">
                      <i data-lucide="eye-off" class="w-3 h-3"></i>
                      <span>Unseen</span>
                    </span>
                  </template>
                </div>

                <h3 class="text-sm font-semibold text-slate-100 hover:text-sky-400 transition truncate" x-text="task.title"></h3>
                <p class="text-xs text-slate-400 line-clamp-1" x-text="task.description || 'No description provided'"></p>

                <div class="flex items-center space-x-4 text-[11px] text-slate-500 pt-1">
                  <span class="flex items-center space-x-1">
                    <i data-lucide="user" class="w-3.5 h-3.5 text-slate-400"></i>
                    <span>Assignee: <strong class="text-slate-300" x-text="task.assignee ? task.assignee.full_name : 'Unassigned'"></strong></span>
                  </span>
                  <span class="flex items-center space-x-1">
                    <i data-lucide="calendar" class="w-3.5 h-3.5 text-slate-400"></i>
                    <span :class="isOverdue(task.due_date) ? 'text-rose-400 font-semibold' : ''" x-text="task.due_date ? 'Due ' + formatDate(task.due_date) : 'No due date'"></span>
                  </span>
                </div>
              </div>

              <!-- Right Actions -->
              <div class="flex items-center space-x-2 shrink-0">
                <button @click="openTaskDetail(task.id)" class="px-3 py-1.5 text-xs font-medium bg-slate-800 hover:bg-slate-700 text-slate-200 rounded-lg transition flex items-center space-x-1">
                  <i data-lucide="external-link" class="w-3.5 h-3.5"></i>
                  <span>Inspect</span>
                </button>

                <!-- Quick Action based on status & role -->
                <template x-if="currentUser.role === 'MEMBER' && task.status !== 'COMPLETED' && task.status !== 'PENDING_REVIEW'">
                  <button @click="quickUpdateStatus(task, 'PENDING_REVIEW')" class="px-3 py-1.5 text-xs font-semibold bg-amber-600/20 hover:bg-amber-600/30 text-amber-300 border border-amber-500/30 rounded-lg transition">
                    Submit for Review
                  </button>
                </template>

                <template x-if="currentUser.role === 'LEADER' && task.status === 'PENDING_REVIEW'">
                  <button @click="quickUpdateStatus(task, 'COMPLETED')" class="px-3 py-1.5 text-xs font-semibold bg-emerald-600 hover:bg-emerald-500 text-white rounded-lg transition flex items-center space-x-1 shadow-md shadow-emerald-600/20">
                    <i data-lucide="check-circle" class="w-3.5 h-3.5"></i>
                    <span>Sign Off</span>
                  </button>
                </template>
              </div>
            </div>
          </template>
        </div>
      </div>
    </template>
  </main>

  <!-- Create Task Modal -->
  <div x-show="createModal" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/70 backdrop-blur-sm" x-cloak>
    <div @click.away="createModal = false" class="bg-slate-900 border border-slate-800 rounded-2xl w-full max-w-lg p-6 space-y-4 shadow-2xl">
      <div class="flex items-center justify-between border-b border-slate-800 pb-3">
        <h3 class="text-base font-bold text-white flex items-center space-x-2">
          <i data-lucide="clipboard-list" class="w-5 h-5 text-sky-400"></i>
          <span>Delegate New Task</span>
        </h3>
        <button @click="createModal = false" class="text-slate-400 hover:text-white"><i data-lucide="x" class="w-5 h-5"></i></button>
      </div>

      <form @submit.prevent="submitCreateTask()" class="space-y-4 text-xs">
        <div>
          <label class="block font-medium text-slate-300 mb-1">Task Title *</label>
          <input type="text" x-model="newTask.title" required placeholder="e.g. Implement AWS S3 upload pipeline" class="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-slate-100 focus:outline-none focus:border-sky-500 text-xs">
        </div>

        <div>
          <label class="block font-medium text-slate-300 mb-1">Detailed Description & Deliverables</label>
          <textarea x-model="newTask.description" rows="3" placeholder="Provide instructions, acceptance criteria, or links..." class="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-slate-100 focus:outline-none focus:border-sky-500 text-xs"></textarea>
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block font-medium text-slate-300 mb-1">Priority</label>
            <select x-model="newTask.priority" class="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-slate-100 focus:outline-none text-xs">
              <option value="LOW">Low</option>
              <option value="MEDIUM" selected>Medium</option>
              <option value="HIGH">High</option>
              <option value="CRITICAL">Critical</option>
            </select>
          </div>
          <div>
            <label class="block font-medium text-slate-300 mb-1">Assignee</label>
            <select x-model="newTask.assignee_id" class="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-slate-100 focus:outline-none text-xs">
              <option value="">Select Member</option>
              <template x-for="m in members" :key="m.id">
                <option :value="m.id" x-text="m.full_name + ' (' + m.email + ')'"></option>
              </template>
            </select>
          </div>
        </div>

        <div>
          <label class="block font-medium text-slate-300 mb-1">Due Date</label>
          <input type="datetime-local" x-model="newTask.due_date" class="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-slate-100 focus:outline-none text-xs">
        </div>

        <div class="pt-3 border-t border-slate-800 flex justify-end space-x-2">
          <button type="button" @click="createModal = false" class="px-4 py-2 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-lg transition">Cancel</button>
          <button type="submit" class="px-4 py-2 bg-sky-600 hover:bg-sky-500 text-white font-semibold rounded-lg transition shadow-md shadow-sky-600/20">Delegate & Notify</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Task Detail & Audit Trail Modal -->
  <div x-show="detailModal" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/75 backdrop-blur-sm" x-cloak>
    <div @click.away="detailModal = false" class="bg-slate-900 border border-slate-800 rounded-2xl w-full max-w-3xl max-h-[90vh] flex flex-col shadow-2xl overflow-hidden">
      <!-- Modal Header -->
      <div class="p-6 border-b border-slate-800 flex items-start justify-between bg-slate-850">
        <div class="space-y-1.5 flex-1 pr-4">
          <div class="flex items-center space-x-2">
            <span class="text-[10px] font-bold px-2 py-0.5 rounded-full uppercase" :class="getPriorityClass(activeTask?.priority)" x-text="activeTask?.priority"></span>
            <span class="text-[10px] font-semibold px-2 py-0.5 rounded-full" :class="getStatusClass(activeTask?.status)" x-text="activeTask?.status?.replace('_', ' ')"></span>
            <template x-if="activeTask?.seen_at">
              <span class="text-[10px] text-emerald-400 bg-emerald-500/10 px-2 py-0.5 rounded border border-emerald-500/20 flex items-center space-x-1">
                <i data-lucide="check" class="w-3 h-3"></i>
                <span x-text="'Read by assignee at ' + formatDate(activeTask?.seen_at)"></span>
              </span>
            </template>
          </div>
          <h2 class="text-lg font-bold text-white" x-text="activeTask?.title"></h2>
        </div>
        <button @click="detailModal = false" class="text-slate-400 hover:text-white p-1 rounded"><i data-lucide="x" class="w-5 h-5"></i></button>
      </div>

      <!-- Modal Body (Scrollable) -->
      <div class="p-6 overflow-y-auto space-y-6 flex-1 text-xs">
        <!-- Overview Grid -->
        <div class="grid grid-cols-1 sm:grid-cols-3 gap-3 bg-slate-950 p-4 rounded-xl border border-slate-800">
          <div>
            <div class="text-slate-500 text-[11px]">Leader</div>
            <div class="font-semibold text-slate-200 mt-0.5" x-text="activeTask?.leader?.full_name"></div>
          </div>
          <div>
            <div class="text-slate-500 text-[11px]">Assignee</div>
            <div class="font-semibold text-slate-200 mt-0.5" x-text="activeTask?.assignee ? activeTask.assignee.full_name : 'None'"></div>
          </div>
          <div>
            <div class="text-slate-500 text-[11px]">Deadline SLA</div>
            <div class="font-semibold text-slate-200 mt-0.5" x-text="activeTask?.due_date ? formatDate(activeTask.due_date) : 'No deadline'"></div>
          </div>
        </div>

        <!-- Description -->
        <div>
          <h4 class="font-bold text-slate-300 uppercase tracking-wider text-[11px] mb-2">Instructions & Scope</h4>
          <div class="bg-slate-950 p-4 rounded-xl border border-slate-800 text-slate-300 leading-relaxed whitespace-pre-wrap" x-text="activeTask?.description || 'No instructions provided.'"></div>
        </div>

        <!-- Verification Loop Actions -->
        <div class="bg-slate-850 p-4 rounded-xl border border-slate-800 space-y-3">
          <h4 class="font-bold text-slate-200 uppercase tracking-wider text-[11px]">Workflow Controls</h4>
          <div class="flex flex-wrap items-center gap-2">
            <!-- Member Status Actions -->
            <template x-if="currentUser?.role === 'MEMBER' && activeTask?.assignee_id === currentUser?.id">
              <div class="flex flex-wrap gap-2">
                <button x-show="activeTask?.status === 'SEEN' || activeTask?.status === 'TODO'" @click="updateTaskStatus(activeTask.id, 'IN_PROGRESS', 'Member initiated work.')" class="px-3 py-1.5 bg-indigo-600 hover:bg-indigo-500 text-white font-medium rounded-lg transition">Start Work (In Progress)</button>
                <button x-show="activeTask?.status === 'IN_PROGRESS'" @click="updateTaskStatus(activeTask.id, 'PENDING_REVIEW', prompt('Provide notes or links for leader verification:') || '')" class="px-3 py-1.5 bg-amber-600 hover:bg-amber-500 text-white font-medium rounded-lg transition">Submit For Leader Review</button>
              </div>
            </template>

            <!-- Leader Verification Loop Actions -->
            <template x-if="currentUser?.role === 'LEADER'">
              <div class="flex flex-wrap gap-2">
                <button x-show="activeTask?.status === 'PENDING_REVIEW'" @click="updateTaskStatus(activeTask.id, 'COMPLETED', 'Leader reviewed and approved deliverables.')" class="px-3 py-1.5 bg-emerald-600 hover:bg-emerald-500 text-white font-semibold rounded-lg transition flex items-center space-x-1.5 shadow-md shadow-emerald-600/20">
                  <i data-lucide="check" class="w-4 h-4"></i>
                  <span>Approve & Mark Completed</span>
                </button>
                <button x-show="activeTask?.status === 'PENDING_REVIEW'" @click="updateTaskStatus(activeTask.id, 'IN_PROGRESS', prompt('Reason for revision / requested changes:') || 'Revisions requested.')" class="px-3 py-1.5 bg-rose-600/20 hover:bg-rose-600/30 text-rose-300 border border-rose-500/30 font-medium rounded-lg transition">
                  Request Revisions
                </button>
              </div>
            </template>
          </div>
        </div>

        <!-- Activity & Audit Trail Timeline -->
        <div class="space-y-3">
          <h4 class="font-bold text-slate-300 uppercase tracking-wider text-[11px] flex items-center space-x-1.5">
            <i data-lucide="history" class="w-4 h-4 text-sky-400"></i>
            <span>Activity & Audit Trail</span>
          </h4>

          <div class="space-y-2 border-l border-slate-800 ml-3 pl-4">
            <template x-for="up in activeTask?.updates || []" :key="up.id">
              <div class="relative group">
                <div class="absolute -left-[21px] top-1.5 w-2 h-2 rounded-full bg-sky-500"></div>
                <div class="bg-slate-950 p-3 rounded-lg border border-slate-800/80 space-y-1">
                  <div class="flex items-center justify-between text-[11px]">
                    <span class="font-semibold text-slate-200" x-text="up.user ? up.user.full_name : 'System'"></span>
                    <span class="text-slate-500 text-[10px]" x-text="formatDate(up.created_at)"></span>
                  </div>
                  <p class="text-slate-300 whitespace-pre-wrap" x-text="up.message"></p>
                  <template x-if="up.attachment_url">
                    <a :href="up.attachment_url" target="_blank" class="inline-flex items-center space-x-1 text-sky-400 hover:underline text-[10px]">
                      <i data-lucide="paperclip" class="w-3 h-3"></i>
                      <span x-text="up.attachment_url"></span>
                    </a>
                  </template>
                </div>
              </div>
            </template>
          </div>

          <!-- Add Update / Comment Form -->
          <form @submit.prevent="submitTaskComment()" class="pt-3 flex flex-col gap-2">
            <input type="text" x-model="commentText" placeholder="Post a progress note, deliverable update, or question..." required class="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-slate-200 focus:outline-none focus:border-sky-500 text-xs">
            <div class="flex items-center justify-between">
              <input type="url" x-model="commentAttachment" placeholder="Attachment URL (optional)" class="w-2/3 bg-slate-950 border border-slate-800 rounded-lg px-3 py-1.5 text-slate-200 focus:outline-none text-[11px]">
              <button type="submit" class="px-3 py-1.5 bg-sky-600 hover:bg-sky-500 text-white rounded-lg transition font-medium text-xs">Post Update</button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>

  <!-- Auth Modal (Login / Register) -->
  <div x-show="authModal" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/75 backdrop-blur-sm" x-cloak>
    <div @click.away="authModal = false" class="bg-slate-900 border border-slate-800 rounded-2xl w-full max-w-md p-6 space-y-5 shadow-2xl">
      <div class="flex items-center justify-between border-b border-slate-800 pb-3">
        <h3 class="text-base font-bold text-white" x-text="authMode === 'login' ? 'Sign In to TaskPulse' : 'Create TaskPulse Account'"></h3>
        <button @click="authModal = false" class="text-slate-400 hover:text-white"><i data-lucide="x" class="w-5 h-5"></i></button>
      </div>

      <form @submit.prevent="submitAuth()" class="space-y-4 text-xs">
        <template x-if="authMode === 'register'">
          <div>
            <label class="block font-medium text-slate-300 mb-1">Full Name</label>
            <input type="text" x-model="authForm.full_name" required placeholder="Alex Mercer" class="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-slate-100 focus:outline-none focus:border-sky-500 text-xs">
          </div>
        </template>

        <div>
          <label class="block font-medium text-slate-300 mb-1">Email Address</label>
          <input type="email" x-model="authForm.email" required placeholder="alex@company.com" class="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-slate-100 focus:outline-none focus:border-sky-500 text-xs">
        </div>

        <div>
          <label class="block font-medium text-slate-300 mb-1">Password</label>
          <input type="password" x-model="authForm.password" required placeholder="••••••••" class="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-slate-100 focus:outline-none focus:border-sky-500 text-xs">
        </div>

        <template x-if="authMode === 'register'">
          <div>
            <label class="block font-medium text-slate-300 mb-1">Account Role</label>
            <select x-model="authForm.role" class="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-slate-100 focus:outline-none text-xs">
              <option value="MEMBER">Team Member (Executor)</option>
              <option value="LEADER">Team Leader (Assigner & Reviewer)</option>
            </select>
          </div>
        </template>

        <div class="pt-2">
          <button type="submit" class="w-full py-2.5 bg-sky-600 hover:bg-sky-500 text-white font-semibold rounded-lg transition shadow-md shadow-sky-600/20" x-text="authMode === 'login' ? 'Sign In' : 'Create Account'"></button>
        </div>

        <div class="text-center text-[11px] text-slate-400">
          <span x-text="authMode === 'login' ? 'Need an account?' : 'Already have an account?'"></span>
          <button type="button" @click="authMode = authMode === 'login' ? 'register' : 'login'" class="text-sky-400 font-semibold hover:underline ml-1" x-text="authMode === 'login' ? 'Register here' : 'Sign in here'"></button>
        </div>
      </form>
    </div>
  </div>

  <!-- Notification Toast -->
  <div x-show="toast.show" x-transition class="fixed bottom-5 right-5 z-50 bg-slate-900 border border-sky-500/40 text-slate-100 px-4 py-3 rounded-xl shadow-2xl flex items-center space-x-3 text-xs" x-cloak>
    <i data-lucide="info" class="w-4 h-4 text-sky-400"></i>
    <span x-text="toast.message"></span>
  </div>

  <script src="/static/app.js"></script>
</body>
</html>
